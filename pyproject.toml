[project]
name = "rag-gis-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shinatip Pattanapitoon", email = "shinatip.ptn@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.17.0",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.3",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
rag-gis-demo = "rag_gis_demo.main:main"
rag-gis-ingest = "rag_gis_demo.ingest:main"
rag-gis-query = "rag_gis_demo.query:main"
rag-gis-test-pdf = "rag_gis_demo.test_pdf:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
